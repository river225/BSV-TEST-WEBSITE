<!DOCTYPE html>

<head>
<script>
(function () {
  try {
    var R = "/";
    if (/\.github\.io$/i.test(location.hostname)) {
      var seg = (location.pathname || "/").split("/").filter(Boolean)[0];
      if (seg) R = "/" + seg + "/";
    }
    window.BSV_SITE_ROOT = R;
    window.bsvSitePath = function (p) { return R + String(p || "").replace(/^\//, ""); };
    function fixAttr(sel, attr) {
      document.querySelectorAll(sel).forEach(function (el) {
        var v = el.getAttribute(attr);
        if (v && v.charAt(0) === "/" && v.indexOf(R) !== 0 && v.indexOf("//") !== 0) {
          el.setAttribute(attr, R + v.slice(1));
        }
      });
    }
    function addIcon(rel, file, type, sizes) {
      var l = document.createElement("link");
      l.rel = rel;
      l.href = R + file;
      if (type) l.type = type;
      if (sizes) l.setAttribute("sizes", sizes);
      document.head.appendChild(l);
    }
    addIcon("icon", "favicon.ico", null, "any");
    addIcon("icon", "favicon.png", "image/png", null);
    addIcon("apple-touch-icon", "apple-touch-icon.png", null, null);
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(function (el) {
        var v = el.getAttribute("href") || "";
        if (v.charAt(0) === "/" && v.indexOf(R) !== 0) el.remove();
      });
      fixAttr('link[href^="/assets/"], a[href^="/assets/"], a[href^="/x-"], a[href^="/z-"], a[href^="/sponsors"]', "href");
      fixAttr('img[src^="/assets/"]', "src");
    });
  } catch (e) {}
})();
</script>

<script>
(function () {
  try {
    var style = localStorage.getItem("bsv-bg-style") || "standard";
    var hue = parseInt(localStorage.getItem("bsv-bg-hue") || "210", 10);
    var root = document.documentElement;
    if (style === "colorized") {
      if (isNaN(hue)) hue = 210;
      hue = Math.max(0, Math.min(360, Math.round(hue)));
      root.style.setProperty("--bsv-hue", String(hue));
      root.style.setProperty("--bsv-accent-hue", String(hue));
      root.style.backgroundColor = "hsl(" + hue + ", 41%, 10%)";
      root.setAttribute("data-bsv-bg", "colorized");
    } else if (style === "dark") {
      root.style.setProperty("--bsv-hue", "220");
      root.style.setProperty("--bsv-accent-hue", "188");
      root.style.backgroundColor = "hsl(220, 20%, 4%)";
      root.setAttribute("data-bsv-bg", "dark");
    }
  } catch (e) {}
})();
</script>

<title>Live Trading — BlockSpin Values (Dev)</title>
<meta name="description" content="Live Trading — development build of BlockSpin Values." />
<link rel="stylesheet" href="style.css?v=20260926-lt-board1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Paytone+One&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Paytone+One&display=swap" /></noscript>
<style>#bsv-site-header { min-height: 70px; }</style>
<script>
(function () {
  try {
    var f = localStorage.getItem("bsv-font") || "default";
    if (!f || f === "default" || f === "paytone") return;
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Nunito+Sans:ital,wght@0,600;0,700;1,600&family=Oswald:wght@500;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap";
    document.head.appendChild(link);
  } catch (e) {}
})();
</script>
<script>
(function () {
  try {
    var fonts = {
      default: "system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif",
      paytone: "'Paytone One', sans-serif",
      nunito: "'Nunito Sans', sans-serif",
      bebas: "'Bebas Neue', sans-serif",
      inter: "'Inter', sans-serif",
      roboto: "'Roboto', sans-serif",
      poppins: "'Poppins', sans-serif",
      oswald: "'Oswald', sans-serif"
    };
    var f = localStorage.getItem("bsv-font") || "default";
    var root = document.documentElement;
    root.style.setProperty("--bsv-site-font", fonts[f] || fonts.default);
    if (f && f !== "default") root.setAttribute("data-bsv-font", f);
  } catch (e) {}
})();
</script>
</head>
<body data-bsv-page="live-trading" class="live-trading-page">

<div id="bsv-site-header"></div>

<button type="button" class="sections-menu-toggle" id="sections-menu-toggle" aria-label="Open sections menu" aria-expanded="false" aria-controls="sections-sidebar">
  <span class="sections-menu-toggle__bar" aria-hidden="true"></span>
  <span class="sections-menu-toggle__bar" aria-hidden="true"></span>
  <span class="sections-menu-toggle__bar" aria-hidden="true"></span>
</button>

<div class="menu-overlay" id="sections-menu-overlay" hidden></div>

<div class="main-container">
  <div class="sections-sidebar" id="sections-sidebar">
    <nav class="sections-nav" id="sections-nav" aria-label="Site sections"></nav>
  </div>

  <main id="sections" class="sections live-trading-main">
    <section class="section live-trading-section" id="live-trading" style="display:block;">
      <div class="live-trading-gate" id="live-trading-gate">
        <div class="live-trading-gate__card">
          <h1 class="live-trading-gate__title" data-i18n="liveTrading.needLogin">You need to Log in</h1>
          <p class="live-trading-gate__body" data-i18n="liveTrading.needLoginBody">To use the Live Trading feature you must login</p>
          <button type="button" class="live-trading-gate__login-btn" id="live-trading-open-login" data-i18n="liveTrading.loginBtn">Log in</button>
        </div>
      </div>

      <div class="live-trading-workspace" id="live-trading-workspace" hidden>
        <div class="lt-board" id="lt-board">
          <header class="lt-board__header">
            <div class="lt-board__header-copy">
              <h1 class="lt-board__title">Live Trading</h1>
              <p class="lt-board__sub">Pick items from the value list — no free-text posts.</p>
            </div>
            <button type="button" class="lt-board__create-btn" id="lt-open-create">Create post</button>
          </header>

          <section class="lt-composer" id="lt-composer" hidden>
            <div class="lt-composer__head">
              <h2 class="lt-composer__title">New trade post</h2>
              <button type="button" class="lt-composer__close" id="lt-close-create" aria-label="Close">&times;</button>
            </div>
            <div class="lt-composer__sides">
              <div class="lt-side" data-side="giving">
                <h3 class="lt-side__label">What I'm giving</h3>
                <div class="lt-side__chips" id="lt-giving-chips"></div>
                <div class="lt-side__actions">
                  <button type="button" class="lt-side__add" data-add="giving">+ Add item</button>
                  <label class="lt-cash">
                    <span>Cash</span>
                    <input type="number" id="lt-giving-cash" min="0" step="1000" placeholder="0" inputmode="numeric" />
                  </label>
                </div>
              </div>
              <div class="lt-composer__swap" aria-hidden="true">→</div>
              <div class="lt-side" data-side="wanting">
                <h3 class="lt-side__label">What I want</h3>
                <div class="lt-side__chips" id="lt-wanting-chips"></div>
                <div class="lt-side__actions">
                  <button type="button" class="lt-side__add" data-add="wanting">+ Add item</button>
                  <button type="button" class="lt-side__lfo" id="lt-add-lfo" title="Looking for offers">Looking for offers</button>
                  <label class="lt-cash">
                    <span>Cash</span>
                    <input type="number" id="lt-wanting-cash" min="0" step="1000" placeholder="0" inputmode="numeric" />
                  </label>
                </div>
              </div>
            </div>
            <p class="lt-composer__error" id="lt-composer-error" hidden></p>
            <div class="lt-composer__foot">
              <button type="button" class="lt-composer__submit" id="lt-submit-post">Post trade</button>
            </div>
          </section>

          <section class="lt-toolbar" aria-label="Search and filters">
            <label class="lt-toolbar__search">
              <span class="visually-hidden">Search posts</span>
              <input type="search" id="lt-search" placeholder="Search items or players…" autocomplete="off" />
            </label>
            <div class="lt-toolbar__filters" role="group" aria-label="Filters">
              <button type="button" class="lt-filter is-active" data-filter="all">All</button>
              <button type="button" class="lt-filter" data-filter="mine">My posts</button>
              <button type="button" class="lt-filter" data-filter="lfo">Looking for offers</button>
            </div>
          </section>

          <section class="lt-feed-wrap">
            <div class="lt-feed" id="lt-feed" role="feed" aria-busy="true">
              <p class="lt-feed__empty" id="lt-feed-empty">Loading trades…</p>
            </div>
          </section>
        </div>
      </div>

      <div class="lt-picker" id="lt-picker" hidden>
        <div class="lt-picker__backdrop" id="lt-picker-backdrop"></div>
        <div class="lt-picker__box" role="dialog" aria-modal="true" aria-labelledby="lt-picker-title">
          <div class="lt-picker__head">
            <h2 class="lt-picker__title" id="lt-picker-title">Add item</h2>
            <button type="button" class="lt-picker__close" id="lt-picker-close" aria-label="Close">&times;</button>
          </div>
          <input type="search" class="lt-picker__search" id="lt-picker-search" placeholder="Search value list…" autocomplete="off" />
          <div class="lt-picker__rarities" id="lt-picker-rarities" role="tablist"></div>
          <div class="lt-picker__grid" id="lt-picker-grid"></div>
          <p class="lt-picker__status" id="lt-picker-status">Loading items…</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Keeps sidebar width identical to home (tax column still reserves 240px even when hidden). -->
  <div class="tax-sidebar-column live-trading-layout-spacer" id="tax-sidebar-column" aria-hidden="true"></div>
</div>

<div id="bsv-sponsor-banner-slot" class="bsv-sponsor-banner-slot"></div>
<div id="bsv-site-footer"></div>

</html>
