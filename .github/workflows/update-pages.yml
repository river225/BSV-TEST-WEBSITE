# Keeps item pages, sitemap and file versions up to date.
# - Every hour: reads the public values Sheet and regenerates item pages if anything changed.
# - On every push to main: re-runs the release tool, so a forgotten `node tools/release.mjs`
#   (stale ?v= or out-of-date generated pages) is fixed automatically.
name: Update pages
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: update-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the minifier (makes style.min.css / script.min.js)
        run: npm install --no-save --no-package-lock esbuild@0.24.0
      - name: Regenerate pages from the Sheet
        run: node tools/release.mjs --fetch-items
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update item pages from the Sheet"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes."
          fi
