<script>
(function () {
  try {
    if (/\/sponsors(\/|$)/i.test(location.pathname || "")) return;
    var style = localStorage.getItem("bsv-bg-style") || "standard";
    var hue = parseInt(localStorage.getItem("bsv-bg-hue") || "210", 10);
    var root = document.documentElement;
    if (style === "colorized") {
      if (isNaN(hue)) hue = 210;
      hue = Math.max(0, Math.min(360, Math.round(hue)));
      root.style.setProperty("--bsv-hue", String(hue));
      root.style.setProperty("--bsv-accent-hue", String(hue));
      root.style.backgroundColor = "hsl(" + hue + ", 41%, 10%)";
      root.setAttribute("data-bsv-bg", "colorized");
    } else if (style === "dark") {
      root.style.setProperty("--bsv-hue", "220");
      root.style.setProperty("--bsv-accent-hue", "188");
      root.style.backgroundColor = "hsl(220, 20%, 4%)";
      root.setAttribute("data-bsv-bg", "dark");
    }
  } catch (e) {}
})();
</script>
<style>
.fb { max-width: 1100px; margin: 100px auto 60px; padding: 0 16px; color: #fff; }
.fb h1 { margin: 0 0 6px; font-size: 2rem; }
.fb__sub { margin: 0 0 18px; color: var(--bsv-muted); }
.fb__msg { padding: 18px; border-radius: 12px; border: 2px solid var(--bsv-accent); background: var(--bsv-surface-card); }
.fb__tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.fb__tab { padding: 8px 14px; border-radius: 8px; border: 2px solid #000; background: var(--bsv-surface-raised); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
.fb__tab.is-on { background: var(--bsv-accent); color: #001018; }
.fb__bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.fb__bar input, .fb__bar select { padding: 8px 10px; border-radius: 8px; border: 2px solid var(--bsv-surface-soft); background: var(--bsv-surface-panel); color: #fff; font: inherit; }
.fb__list { display: grid; gap: 10px; }
.fb-card { padding: 12px 14px; border-radius: 12px; border: 2px solid #000; background: var(--bsv-surface-card); display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; }
.fb-card.is-done { opacity: .5; }
.fb-card h3 { margin: 0; font-size: 1.05rem; }
.fb-card h3 a { color: inherit; }
.fb-card__meta { color: var(--bsv-muted); font-size: .82rem; }
.fb-card__vals { font-size: .9rem; }
.fb-card__vals b { color: #4ade80; } .fb-card__vals i { color: #facc15; font-style: normal; font-weight: 800; }
.fb-card__why { grid-column: 1 / -1; margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--bsv-surface-panel); white-space: pre-wrap; }
.fb-card__done { align-self: start; padding: 6px 12px; border-radius: 8px; border: 2px solid #000; background: #22c55e; color: #052e16; font-weight: 900; cursor: pointer; }
.fb-card.is-done .fb-card__done { background: var(--bsv-surface-soft); color: #fff; }
.fb-table { width: 100%; border-collapse: collapse; background: var(--bsv-surface-card); border-radius: 12px; overflow: hidden; }
.fb-table th, .fb-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--bsv-surface-soft); }
.fb-table th { background: var(--bsv-surface-raised); font-size: .8rem; text-transform: uppercase; color: var(--bsv-muted); }
.fb-up { color: #4ade80; font-weight: 800; } .fb-down { color: #f87171; font-weight: 800; }
