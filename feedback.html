<script>
(function () {
  try {
    if (/\/sponsors(\/|$)/i.test(location.pathname || "")) return;
    var style = localStorage.getItem("bsv-bg-style") || "standard";
    var hue = parseInt(localStorage.getItem("bsv-bg-hue") || "210", 10);
    var root = document.documentElement;
    if (style === "colorized") {
      if (isNaN(hue)) hue = 210;
      hue = Math.max(0, Math.min(360, Math.round(hue)));
      root.style.setProperty("--bsv-hue", String(hue));
      root.style.setProperty("--bsv-accent-hue", String(hue));
      root.style.backgroundColor = "hsl(" + hue + ", 41%, 10%)";
      root.setAttribute("data-bsv-bg", "colorized");
    } else if (style === "dark") {
      root.style.setProperty("--bsv-hue", "220");
      root.style.setProperty("--bsv-accent-hue", "188");
      root.style.backgroundColor = "hsl(220, 20%, 4%)";
      root.setAttribute("data-bsv-bg", "dark");
    }
  } catch (e) {}
})();
</script>
<style>
.fb { max-width: 1100px; margin: 100px auto 60px; padding: 0 16px; color: #fff; min-height: calc(100vh - 470px); box-sizing: border-box; }
.fb h1 { margin: 0 0 6px; font-size: 2rem; }
.fb__sub { margin: 0 0 18px; color: var(--bsv-muted); }
.fb__msg { padding: 18px; border-radius: 12px; border: 2px solid var(--bsv-accent); background: var(--bsv-surface-card); }
.fb__bar { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; align-items: center; }
.fb__bar label { display: inline-flex; gap: 6px; align-items: center; color: var(--bsv-muted); font-weight: 700; font-size: .85rem; }
.fb__bar input { padding: 8px 10px; border-radius: 8px; border: 2px solid var(--bsv-surface-soft); background: var(--bsv-surface-panel); color: #fff; font: inherit; color-scheme: dark; }
.fb__bar--search input { width: 100%; max-width: 420px; font-size: 1rem; }
.fb-btn { padding: 7px 12px; border-radius: 8px; border: 2px solid #000; background: var(--bsv-surface-raised); color: #fff; font: inherit; font-weight: 800; font-size: .85rem; cursor: pointer; }
.fb-btn.is-on, .fb-btn:hover { background: var(--bsv-accent); color: #001018; }
.fb-muted { color: var(--bsv-muted); font-size: .85rem; }
.fb-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0 0 12px; }
.fb-stat { padding: 12px; border-radius: 12px; border: 2px solid #000; background: var(--bsv-surface-card); }
.fb-stat span { display: block; font-size: .75rem; font-weight: 800; text-transform: uppercase; color: var(--bsv-muted); }
.fb-stat b { font-size: 1.6rem; }
.fb-stat--up b { color: #4ade80; } .fb-stat--down b { color: #f87171; }
.fb-table { width: 100%; border-collapse: collapse; background: var(--bsv-surface-card); border-radius: 12px; overflow: hidden; }
.fb-table th, .fb-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--bsv-surface-soft); }
.fb-table th { background: var(--bsv-surface-raised); font-size: .8rem; text-transform: uppercase; color: var(--bsv-muted); }
.fb-row { cursor: pointer; } .fb-row:hover { background: var(--bsv-surface-hover); }
.fb-up { color: #4ade80; font-weight: 800; } .fb-down { color: #f87171; font-weight: 800; }
.fb-item-title { margin: 12px 0 2px; font-size: 1.6rem; }
.fb-hist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 14px; }
.fb-hist p { flex-basis: 100%; margin: 0; }
.fb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fb-cols h3 { margin: 0 0 8px; }
.fb-vote { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start; padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid #000; background: var(--bsv-surface-card); }
.fb-vote img, .fb-vote__av { width: 34px; height: 34px; border-radius: 50%; background: var(--bsv-surface-soft); }
.fb-vote p { margin: 0; }
.fb-vote__why { margin-top: 6px !important; padding: 8px; border-radius: 8px; background: var(--bsv-surface-panel); white-space: pre-wrap; }
.fb-vote__why i { color: #facc15; font-style: normal; font-weight: 800; }
@media (max-width: 760px) { .fb { margin-top: 80px; } .fb-cols { grid-template-columns: 1fr; } .fb-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
